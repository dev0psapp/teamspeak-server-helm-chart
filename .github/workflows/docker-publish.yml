name: Docker

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image name and tags
        id: image
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${REGISTRY}/${repo}" >> "$GITHUB_OUTPUT"
          app_version=$(grep '^appVersion:' Chart.yaml | awk '{print $2}' | tr -d '"')
          chart_version=$(grep '^version:' Chart.yaml | awk '{print $2}' | tr -d '"')
          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${chart_version}" >> "$GITHUB_OUTPUT"
          echo "package=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.image.outputs.app_version }}
            type=raw,value=${{ steps.image.outputs.chart_version }}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Org GHCR packages are private by default. GITHUB_TOKEN can push the
      # image but often cannot change visibility; a classic PAT in
      # PACKAGES_TOKEN (write:packages) can. Anonymous pulls need public.
      - name: Make package public
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          pkg="${{ steps.image.outputs.package }}"
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ -n "${PACKAGES_TOKEN}" ]; then
            export GH_TOKEN="${PACKAGES_TOKEN}"
          fi
          for i in 1 2 3 4 5 6; do
            if gh api --method PATCH "/orgs/${owner}/packages/container/${pkg}" --field visibility=public; then
              echo "Package ${owner}/${pkg} is public"
              exit 0
            fi
            echo "Visibility update failed, retry ${i}/6"
            sleep 10
          done
          echo "::warning::Could not set ${owner}/${pkg} to public. Open the package settings and choose Change visibility → Public. Artifact Hub cannot scan a private image."
          exit 1

      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
